name: tests

concurrency:
  group: phpunit-tests-${{ github.ref_name }}
  cancel-in-progress: true

on: ['push', 'pull_request', 'workflow_dispatch']

jobs:
  static_code_analysis:
    runs-on: 'ubuntu-24.04'
    name: 'Static code analysis (Symfony ${{ matrix.symfony }})'
    strategy:
      fail-fast: false
      matrix:
        # Run on PHP 8.4 so every supported Symfony major (including 8.x,
        # which requires PHP >= 8.4.1) can be installed and analysed.
        symfony:
          - '^6.4'
          - '^7.0'
          - '^8.0'
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Validate composer.json'
        run: composer validate --no-check-lock

      - name: 'Restrict Symfony Serializer version'
        run: composer require --no-update --no-interaction "symfony/serializer:${{ matrix.symfony }}"

      - name: 'Install dependencies with Composer'
        uses: 'ramsey/composer-install@v2'
        with:
          dependency-versions: 'highest'
          composer-options: '--prefer-dist'

      - name: Check code quality and coding standards
        run: composer check-code

  phpunit:
    needs: [ static_code_analysis ]
    runs-on: 'ubuntu-24.04'
    name: 'PHPUnit (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
        symfony:
          - '^6.4'
          - '^7.0'
          - '^8.0'
        exclude:
          # Symfony 8 requires PHP >= 8.4.1, so it cannot run on PHP 8.3.
          - php: '8.3'
            symfony: '^8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: 'pcov'
          tools: 'composer:v2'
          extensions: 'curl, json, openssl'
          ini-values: 'memory_limit=256M'

      - name: 'Restrict Symfony Serializer version'
        run: composer require --no-update --no-interaction "symfony/serializer:${{ matrix.symfony }}"

      - name: 'Install dependencies with Composer'
        uses: 'ramsey/composer-install@v2'
        with:
          dependency-versions: 'highest'
          composer-options: '--prefer-dist'

      - name: 'Run phpunit tests'
        run: vendor/bin/phpunit --coverage-clover=tests/clover.xml 2>/dev/null

      - name: Upload coverage results to Coveralls
        if: matrix.php == '8.4' && matrix.symfony == '^7.0'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: tests/clover.xml

#        env:
#          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
#        run: |
#          vendor/bin/php-coveralls --coverage_clover=tests/clover.xml --json_path=tests/coveralls.json -v
